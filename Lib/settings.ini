; Unified settings for Geom-Stats helpers (plot_gnuplot / vmd_viewer / mol_preview).
; Edit the relevant Part below; section names are shared across modules.
; Divider lines use "; ==========" so ConfigParser treats them as comments.

; ========== Plot Part ==========
; Used by plot_gnuplot.py (project root)
; Change [output] format to switch png / pdf / svg / eps.
; The plot script keeps set terminal and set output extension in sync.
; Manual .plt edits must change BOTH terminal and output together:
;   png -> pngcairo | pdf -> pdfcairo | svg -> svg | eps -> epscairo

[output]
; png | pdf | svg | eps
format = svg

[figure]
width = 1200
height = 750

[font]
family = Arial
base_size = 18
label_size = 20
key_size = 18

[style]
line_width = 2
border_line_width = 1.5
show_grid = true
grid_line_width = 0.5
grid_color = #CCCCCC
show_key = true

[axes]
xlabel = Step
; Leave empty to auto-build from "# Quantity" / "# Unit" in the statistics .txt
ylabel =

[gnuplot]
command = gnuplot

; ========== VMD Part ==========
; Used by vmd_viewer.py (project root)
; Point [vmd] executable to your local vmd.exe (Windows) or vmd launcher.

[vmd]
; Full path preferred. Relative paths are resolved from this ini directory,
; then from the Geom-Stats app root, then from PATH.
executable = E:\VMD64\VMD\vmd.exe

[launch]
; Extra arguments before -e script (space-separated). Example: -nt
extra_args = -nt

[temp]
; Directory for temporary XYZ exported from ORCA/Gaussian outputs.
; Leave empty to use the system temp directory.
directory =

[display]
; Representation: Lines | CPK | Licorice | VDW
style = CPK

; --- Lines ---
; Bond/line thickness
lines_thickness = 1.0

; --- CPK ---
; Sphere scale relative to VDW radius; bond radius (Angstrom)
cpk_sphere_scale = 0.8
cpk_bond_radius = 0.3
cpk_sphere_resolution = 12
cpk_bond_resolution = 12

; --- Licorice ---
licorice_bond_radius = 0.1
licorice_sphere_resolution = 12
licorice_bond_resolution = 12

; --- VDW ---
vdw_sphere_scale = 1.0
vdw_sphere_resolution = 12

[color]
; yes = apply GaussView-like Element palette (Lib/gview_element_colors.tcl)
; no  = keep VMD default coloring
use_gview_element = yes
; Palette script path (relative to this ini / Lib, or absolute)
gview_palette = gview_element_colors.tcl

; ========== Preview Part ==========
; Used by mol_preview.py (built-in selected-frame preview)

[preview]
; Show covalent bonds as gray lines
show_bonds = yes
; Show 1-based atom index labels
show_labels = yes
label_fontsize = 10
; Bond length cutoff scale relative to sum of covalent radii
bond_cutoff_scale = 1.15
; Point size for atoms / highlighted atoms
atom_size = 60
highlight_size = 140
; Window title
window_title = Geom-Stats Preview (selected frame)
